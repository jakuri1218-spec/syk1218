<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>秋味登場！！ | TACOBA</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body id="top">

<header>

    <div class="container">

        <a href="index.html" class="logo">
            <img src="images/ロゴ.png" alt="TaCoBaロゴ">
        </a>

        <button
            class="hamburger"
            id="hamburger"
            type="button"
            aria-label="メニューを開く"
        >
            ☰
        </button>

        <nav id="nav">

            <a href="index.html#about">ABOUT</a>
            <a href="index.html#menu">MENU</a>
            <a href="index.html#gallery">NEWS</a>
            <a href="index.html#shop">RESERVE</a>

        </nav>

    </div>

</header>

<div id="overlay"></div>


<main>

    <section class="news-detail">

        <div class="container">

            <p class="news-detail-date">
                2026.10.20
            </p>

            <h1>
                たこ焼きに季節限定の<br>
                「秋味」登場！！
            </h1>

            <div class="news-detail-image">
                <img
                    src="images/1たこ.jpg"
                    alt="秋味のたこ焼き"
                >
            </div>

            <div class="news-detail-text">

                <p>
                    秋の季節にぴったりな、
                    期間限定の「秋味」が登場しました！！
                </p>

                <p>
                    旬の食材を使った、
                    この季節だけのお楽しみ。
                </p>

                <p>
                    どんな味なのかは、
                    <strong>食べてみてのお楽しみ～！！</strong>
                </p>

                <p>
                    焼きたてのたこ焼きと一緒に、
                    秋の夜長をTACOBAでお楽しみください。
                </p>

            </div>

            <a href="index.html#gallery" class="news-back">
                ← NEWS一覧へ戻る
            </a>

        </div>

    </section>

</main>


<footer>

    <div id="yoko">

        <div class="footer-info">

            <img src="images/ロゴ.png" alt="TACOBAロゴ">

            <p id="add">
                〒923-0043<br>
                石川県小松市一針町ホ47番地

                <span>
                    営業時間：17:00〜24:00
                </span>

                <span>
                    TEL：0761-21-8700
                </span>
            </p>

        </div>

    </div>

    <p>
        © 2026 TACOBA
    </p>

</footer>


<script>

const hamburger = document.getElementById("hamburger");
const nav = document.getElementById("nav");
const overlay = document.getElementById("overlay");

hamburger.addEventListener("click", () => {

    nav.classList.toggle("active");
    overlay.classList.toggle("active");

    hamburger.textContent =
        nav.classList.contains("active")
            ? "✕"
            : "☰";

});

overlay.addEventListener("click", () => {

    nav.classList.remove("active");
    overlay.classList.remove("active");

    hamburger.textContent = "☰";

});

document.querySelectorAll("#nav a").forEach((link) => {

    link.addEventListener("click", () => {

        nav.classList.remove("active");
        overlay.classList.remove("active");

        hamburger.textContent = "☰";

    });

});

</script>

</body>
</html>
